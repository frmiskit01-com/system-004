<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی کۆگا و گەڕانی خێرا</title>
    <!-- QuaggaJS بۆ سکانکردنی بارکۆد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --table-header: #f1f5f9;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary-color: #6366f1;
            --primary-hover: #818cf8;
            --danger-color: #f87171;
            --success-color: #34d399;
            --table-header: #0f172a;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.3rem;
        }

        .theme-toggle {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .theme-toggle:hover {
            background: var(--primary-hover);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            width: auto;
            margin: 0 2px;
        }

        .btn-danger {
            background: var(--danger-color);
        }

        .btn-success {
            background: var(--success-color);
        }

        #interactive.viewport {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
            margin-bottom: 10px;
        }
        #interactive.viewport canvas, #interactive.viewport video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-box {
            margin-top: 10px;
            padding: 12px;
            background: var(--bg-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: right;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--table-header);
        }

        .expired {
            color: var(--danger-color);
            font-weight: bold;
        }
        
        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <header>
            <h1>سیستەمی کۆگا (گەڕان و سکانەر)</h1>
            <button class="theme-toggle" onclick="toggleTheme()">گۆڕینی دۆخ (ڕەش / سپی)</button>
        </header>

        <div class="grid">
            <!-- زیادکردنی کاڵای نوێ -->
            <div class="card">
                <h2>زیادکردنی کاڵای نوێ بۆ کۆگا</h2>
                <form id="addProductForm" onsubmit="addNewProduct(event)">
                    <div class="form-group">
                        <label>بارکۆد:</label>
                        <input type="text" id="newBarcode" required placeholder="بارکۆد بنووسە...">
                    </div>
                    <div class="form-group">
                        <label>ناوی کاڵا:</label>
                        <input type="text" id="newName" required placeholder="ناوی کاڵا...">
                    </div>
                    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0;">
                        <div class="form-group">
                            <label>نرخ (دینار):</label>
                            <input type="number" id="newPrice" required placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>دانە (بڕ):</label>
                            <input type="number" id="newQty" required placeholder="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>مێژووی بەسەرچوون:</label>
                        <input type="date" id="newExpiry" required>
                    </div>
                    <button type="submit" class="btn btn-success">تۆمارکردن</button>
                </form>
            </div>

            <!-- بەشی سکانەر و گەڕان -->
            <div class="card">
                <h2>گەڕان و سکانەری خێرا</h2>
                <div id="interactive" class="viewport"></div>
                <button class="btn" onclick="startScanner()" style="margin-bottom: 10px;">دەستپێکردنی کامێرا</button>
                
                <div class="form-group">
                    <label>گەڕان بەدوای بارکۆد یان ناودا:</label>
                    <input type="text" id="searchInput" placeholder="لێرە بنووسە بۆ دۆزینەوە..." oninput="filterTable()">
                </div>

                <div class="result-box" id="quickResult">
                    <p style="opacity: 0.7;">ئەنجامی گەڕان لێرە دەردەکەوێت...</p>
                </div>
            </div>
        </div>

        <!-- خشتەی کۆگا -->
        <div class="card">
            <h2>لیستی کاڵاکانی کۆگا</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>بارکۆد</th>
                            <th>ناوی کاڵا</th>
                            <th>نرخ</th>
                            <th>دانە</th>
                            <th>مێژووی بەسەرچوون</th>
                            <th>کردارەکان</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <!-- داتاکان لێرە دادەنرێن -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // هێنانی داتا لە LocalStorage یان دابینکردنی نموونە
        let inventory = JSON.parse(localStorage.getItem('myInventory')) || {
            "123456": { name: "شەکر (1 کیلۆ)", price: 1500, qty: 45, expiry: "2027-05-12" },
            "654321": { name: "زەیتی خواردن", price: 3200, qty: 12, expiry: "2026-08-20" }
        };

        function saveToStorage() {
            localStorage.setItem('myInventory', JSON.stringify(inventory));
        }

        // بڵاوکردنەوەی خشتەکە بەپێی گەڕان
        function loadTable(searchTerm = "") {
            const tbody = document.getElementById('inventoryTable');
            tbody.innerHTML = '';
            
            searchTerm = searchTerm.toLowerCase().trim();
            let keys = Object.keys(inventory);
            
            // فلتەرکردنی ورد و دروست بۆ بارکۆد و ناو
            let filteredKeys = keys.filter(code => {
                let item = inventory[code];
                return code.toLowerCase().includes(searchTerm) || item.name.toLowerCase().includes(searchTerm);
            });

            if (filteredKeys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; opacity: 0.7;">هیچ کاڵایەک نەدۆزرایەوە.</td></tr>`;
                return;
            }

            filteredKeys.forEach(code => {
                let item = inventory[code];
                let isExpired = new Date(item.expiry) < new Date();
                let row = `<tr>
                    <td>${code}</td>
                    <td><b>${item.name}</b></td>
                    <td>${item.price} دینار</td>
                    <td>${item.qty} دانە</td>
                    <td class="${isExpired ? 'expired' : ''}">${item.expiry}</td>
                    <td>
                        <button class="btn btn-sm btn-success" onclick="updateQty('${code}', 1)">+</button>
                        <button class="btn btn-sm" onclick="updateQty('${code}', -1)">-</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteItem('${code}')">سڕینەوە</button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // فرمانی گەڕان (کە کێشەکەی تێدا چارەسەر کراوە)
        function filterTable() {
            let val = document.getElementById('searchInput').value;
            loadTable(val);
            
            // نیشاندانی زانیاری خێرا ئەگەر کۆدەکە یان بەشێک لە ناوەکە هەبێت
            let matchedCode = Object.keys(inventory).find(code => code === val.trim() || inventory[code].name.toLowerCase().includes(val.toLowerCase().trim()));
            
            if (matchedCode) {
                let item = inventory[matchedCode];
                let isExpired = new Date(item.expiry) < new Date();
                document.getElementById('quickResult').innerHTML = `
                    <p><strong>بارکۆد:</strong> ${matchedCode}</p>
                    <p><strong>ناوی کاڵا:</strong> ${item.name}</p>
                    <p><strong>نرخ:</strong> ${item.price} دینار</p>
                    <p><strong>بڕی ماوە:</strong> ${item.qty} دانە</p>
                    <p><strong>بەسەرچوون:</strong> <span class="${isExpired ? 'expired' : ''}">${item.expiry}</span></p>
                `;
            } else {
                document.getElementById('quickResult').innerHTML = `<p style="opacity: 0.7;">هیچ ئەنجامێک بۆ "${val}" نەدۆزرایەوە.</p>`;
            }
        }

        // زیادکردنی کاڵای نوێ
        function addNewProduct(event) {
            event.preventDefault();
            let code = document.getElementById('newBarcode').value.trim();
            let name = document.getElementById('newName').value.trim();
            let price = Number(document.getElementById('newPrice').value);
            let qty = Number(document.getElementById('newQty').value);
            let expiry = document.getElementById('newExpiry').value;

            inventory[code] = { name, price, qty, expiry };
            saveToStorage();
            loadTable();
            
            document.getElementById('addProductForm').reset();
            alert("کاڵاکە بە سەرکەوتوویی زیادکرا!");
        }

        // کەم و زیادکردنی بڕ
        function updateQty(code, amount) {
            if (inventory[code]) {
                inventory[code].qty += amount;
                if (inventory[code].qty < 0) inventory[code].qty = 0;
                saveToStorage();
                loadTable(document.getElementById('searchInput').value);
            }
        }

        // سڕینەوەی کاڵا
        function deleteItem(code) {
            if (confirm("دڵنیای لە سڕینەوەی ئەم کاڵایە؟")) {
                delete inventory[code];
                saveToStorage();
                loadTable();
            }
        }

        // گۆڕینی دۆخ (Dark / Light)
        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        // سکانەری بارکۆد
        function startScanner() {
            Quagga.init({
                inputStream : {
                    name : "Live",
                    type : "LiveStream",
                    target: document.querySelector('#interactive')    
                },
                decoder : {
                    readers : ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader"]
                }
            }, function(err) {
                if (err) {
                    alert("هەڵە لە کردنەوەی کامێرا!");
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(function(result) {
                let code = result.codeResult.code;
                document.getElementById('searchInput').value = code;
                filterTable();
                Quagga.stop();
            });
        }

        // جێبەجێکردنی سەرەتایی
        loadTable();
    </script>
</body>
</html>
